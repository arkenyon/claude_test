<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Environment Info</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18202a;
            --muted: #657180;
            --paper: #f5f1e8;
            --panel: #fffdf8;
            --accent: #d45d3f;
            --line: #ded7ca;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: var(--paper);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(100%, 680px);
            padding: clamp(28px, 7vw, 64px);
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 12px 12px 0 #e8dfd0;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--accent);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 480px;
            margin: 0;
            font-size: clamp(2.4rem, 8vw, 5rem);
            line-height: 0.95;
            letter-spacing: -0.04em;
        }

        p {
            max-width: 480px;
            margin: 24px 0 28px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        button {
            border: 0;
            padding: 13px 18px;
            color: #fffaf2;
            background: var(--accent);
            font: 700 0.9rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            cursor: pointer;
        }

        button:hover {
            background: #b94b31;
        }

        button:focus-visible {
            outline: 3px solid #f0a38d;
            outline-offset: 3px;
        }

        #results {
            display: none;
            margin-top: 32px;
            border-top: 1px solid var(--line);
        }

        #results.visible {
            display: block;
        }

        .info-row {
            display: grid;
            grid-template-columns: minmax(120px, 0.7fr) 1.3fr;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
        }

        dt {
            color: var(--muted);
            font-size: 0.9rem;
        }

        dd {
            margin: 0;
            overflow-wrap: anywhere;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .info-row {
                grid-template-columns: 1fr;
                gap: 5px;
            }
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Browser diagnostic</p>
        <h1>What is this environment?</h1>
        <p>Click the button to inspect the browser, device, screen, and connection details available to this page.</p>
        <button id="inspect-button" type="button">Show environment info</button>

        <dl id="results" aria-live="polite"></dl>
    </main>

    <script>
        const button = document.querySelector('#inspect-button');
        const results = document.querySelector('#results');

        function addInfo(label, value) {
            const row = document.createElement('div');
            row.className = 'info-row';
            row.innerHTML = `<dt>${label}</dt><dd></dd>`;
            row.querySelector('dd').textContent = value;
            results.appendChild(row);
        }

        button.addEventListener('click', () => {
            results.replaceChildren();

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const environment = [
                ['Browser', navigator.userAgent],
                ['Language', navigator.language],
                ['Platform', navigator.platform || 'Unavailable'],
                ['Screen', `${window.screen.width} × ${window.screen.height}`],
                ['Viewport', `${window.innerWidth} × ${window.innerHeight}`],
                ['Color depth', `${window.screen.colorDepth} bits`],
                ['Online', navigator.onLine ? 'Yes' : 'No'],
                ['Connection', connection?.effectiveType || 'Unavailable'],
                ['Time zone', Intl.DateTimeFormat().resolvedOptions().timeZone]
            ];

            environment.forEach(([label, value]) => addInfo(label, value));
            results.classList.add('visible');
            button.textContent = 'Refresh environment info';
        });
    </script>
</body>

</html>
